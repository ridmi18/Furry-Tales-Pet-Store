<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Furry Tales - Contact Us</title>    
    <link rel="icon" href="img/logo.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar">
        <div class="navbar-container">
            <button class="navbar-toggler" onclick="toggleMenu()">&#9776;</button>
            <h1 class="logo">Furry Tales
                <img src="img/logo.png" alt="Furry Tales Logo">
            </h1>
            <ul class="menu-items default-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="pet-details.html">Pets</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
        </div>
    </nav>
    <div class="side-menu" id="sideMenu">
        <button class="close-btn" onclick="toggleMenu()">&times;</button>
        <ul class="menu-items">
            <li><a href="index.html">Home</a></li>
            <li><a href="pet-details.html">Pets</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="about.html">About</a></li>
        </ul>
    </div>

    <section id="contact">
        <div class="contact-container">
            <h2>Contact Us</h2>
            <form id="contact-form">
                <label for="name">Name:</label>
                <input type="text" id="name">
            
                <label for="email">Email:</label>
                <input type="email" id="email">
            
                <label for="subject">Subject:</label>
                <input type="text" id="subject">
            
                <label for="message">Message:</label>
                <textarea id="message" cols="30" rows="6"></textarea>
            
                <button type="submit" class="button" onclick="validateForm()">Submit</button>
            </form>
            
        </div>
    </section>

    <footer id="footer">
        <h2>Follow us on</h2>
        <div class="footer-social-media">
            <a href="https://facebook.com">
                <img src="img/facebook.png" alt="Facebook" />
            </a>
            <a href="https://twitter.com">
                <img src="img/twitter.png" alt="Twitter" />
            </a>
            <a href="https://instagram.com">
                <img src="img/instagram.png" alt="Instagram" />
            </a>
        </div>
        <p>&copy; 2024 Furry Tales. All rights reserved.</p>
    </footer>
    <script src="script.js"></script>
</body>

</html>
